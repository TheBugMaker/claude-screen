# Example ~/.config/ccs/config.toml
#
# A project's .ccs/config.toml changes any of it for that project: see example-project.toml.
#
# Every Claude session gets a Chat tab plus the tabs below. Without any [[tab]], ccs uses
# a `review` tab (git diff) and a `shell` tab ($SHELL). Commands run with `sh -c` in the
# session's directory (its worktree, when it has one), with TERM=xterm-256color and:
#
#   CS_CWD          the session's directory
#   CS_REPO         where the session started: the main checkout when it has a worktree
#   CS_BRANCH       the branch checked out in CS_CWD
#   CS_REPO_BRANCH  the branch checked out in CS_REPO, which leader m merges into
#   CS_GIT_BASE     the commit the session's worktree started from
#   CS_SESSION_ID   Claude's session id
#   CS_TITLE        the session's /rename name, else the title Claude gave it
#
# Each is empty when there is none, or before Claude reports it. For example:
# command = "git --no-pager diff --color=always $CS_GIT_BASE | less -R"
#
# Modes:
#   eager      run every time the tab comes on screen
#   lazy       run the first time the tab is opened (the default)
#   regular    run in the background when the session starts, so it is up before the tab
#              is opened
#
# Press the leader, then Enter, to run the tab's command again. Press Enter in a tab whose
# command has exited to do the same.

# Keys are written as vim writes them:
#
#   <leader>f           f after the leader
#   <C-f> <A-f>         Ctrl-F, Alt-F, on their own (<M-f> is Alt-F too). Without the leader,
#                       a key needs Ctrl or Alt: the others are what you type
#   N                   Shift is in the character's case: <leader>N, <A-N>
#   <Space> <CR> <lt>   Space, Enter, and < itself: <C-Space>, <leader><CR>
#
# A key without the leader goes to ccs, not to Claude or the program in the tab, wherever it
# does something.

# Starts a key after the leader. Press it twice to send it to the program in the tab, Claude
# included.
leader = "<C-Space>"

# Colors Claude, ccs and every tab. Built in: gruvbox-dark, gruvbox-light, tokyonight-night,
# tokyonight-day, github-dark, one-dark. A file ~/.config/ccs/themes/<name>.json adds one, or
# replaces a built-in one of that name. Without a theme, Claude keeps your own and the tabs your
# terminal's colors.
# theme = "gruvbox-dark"

# Switching sessions slides the new one in from the side its chip is on, over this many
# milliseconds for every 100 columns, so a wider window slides at the same speed. 0 switches
# at once.
slide_ms = 150

# Each new session works in its own git worktree and branch (`claude --worktree`), so sessions
# don't change each other's files. Its tabs run there too. On /exit, Claude removes a worktree
# with nothing in it, and asks first when it has changes, commits made since the session started
# (merged or not), or a /rename name. ccs removes it when it closes a session another way, or when
# you kept one whose commits are in other branches already, if nothing in it would be lost, but
# not after a [[merge]] with after = "keep". Sessions outside git, or before the first commit, get
# none.
worktree = true

# A new session starts in Claude's plan mode (`claude --permission-mode plan`): Claude plans and
# asks you to approve the plan before it changes anything. Shift+Tab changes the mode as usual.
# Resumed sessions, and one opened to fix a merge's conflicts, start in your own default mode.
plan = true

# How the mods ccs gives Claude learn that a permission dialog waits for you, that work Claude left
# in the background will wake it, and that /clear or /resume swapped the conversation: Claude Code
# tells only its classic hooks. Where an organization manages Claude Code (managed settings, or a
# Team or Enterprise login), its guard keeps those hooks from the mods you install, and each skipped
# hook says so in the transcript. There, "guarded" learns without them: a session counts as waiting
# once an ask is still unanswered after 3 s, and one asleep on background work shows as idle, so the
# merge panel no longer stops you from closing it.
signals = "classic"

# What each key does: one key, or a list of them. List only the actions you change; the others
# keep the keys below, and [] leaves one without a key. No two can have the same key, but for
# rerun_tab and the submit_* ones: they never work in the same tab.
[keys]
session_1 = "<leader>1"                 # go to session 1, and so on to session_9
session_2 = "<leader>2"
session_3 = "<leader>3"
session_4 = "<leader>4"
session_5 = "<leader>5"
session_6 = "<leader>6"
session_7 = "<leader>7"
session_8 = "<leader>8"
session_9 = "<leader>9"
previous_session = "<leader>,"
next_session = "<leader>."
new_session = "<leader>n"               # in a worktree of its own, with worktree = true
new_session_no_worktree = "<leader>N"
find = "<leader>f"                      # find a session, open or past
merge = "<leader>m"                     # commit and merge the session's work: see [[merge]]
chat = "<leader>c"                      # go to the Chat tab
chat_split = "<leader>C"                # show Chat beside the tab on screen: see [[tab]]
other_pane = "<leader>o"                # in a split, give your keys to the other side
previous_tab = "<leader>["
next_tab = "<leader>]"
rerun_tab = "<leader><CR>"              # in a terminal tab: run its command again
submit_and_new_session = "<leader><CR>" # in Chat: submit, then open a session without a worktree
submit_and_stay = "<leader>w"           # in Chat: submit and stay
quit = "<leader>q"
# For example, Alt and a digit go to a session as well as the leader and the digit:
# session_1 = ["<leader>1", "<A-1>"]

# A tab's key goes to it: one key or a list, as in [keys]. Its split_key shows it beside the
# tab on screen instead, and gives it your keys:
#
#   - Chat is on the left whenever it is one of the two
#   - with two on screen already, it takes the place of the one on the right
#   - if it is one of the two, it goes, and the other one has the screen
#   - if it is on screen alone, Chat comes beside it
#
# Click a side, or press other_pane, to type there. Its key, or Chat's, shows it alone again.
[[tab]]
name = "review"
key = "<leader>r"
split_key = "<leader>R"
mode = "eager"
command = "git diff"

[[tab]]
name = "shell"
key = "<leader>s"
split_key = "<leader>S"
mode = "regular"
command = "$SHELL"

[[tab]]
name = "git"
key = ["<leader>g", "<A-g>"]
split_key = "<leader>G"
command = "lazygit"

# Leader m gets the session's work into its target. A panel shows what will happen and asks
# for a commit message when there is something to commit, prefilled with the session's title.
# Enter runs the action in a tab of its own (passphrases and other prompts work there):
#
#   commit       runs first, in the session's directory, when it has changes; the message is
#                in CS_MESSAGE (default: git add -A && git commit -m "$CS_MESSAGE")
#   command      runs next, with the tab variables above. Exiting 0 means the work is in, and
#                `after` says what comes next. CS_BRANCH is the branch when the action started:
#                after git branch -m, ask git (git branch --show-current)
#   on_conflict  when the command stops on conflicts, the prompt for the Claude that fixes
#                them, with $CS_* names filled in: the session's own Claude for conflicts in its
#                directory, a new merge session in the main checkout for conflicts there. The
#                merge session opens right after the session merged, and if you were on that
#                one it takes you there, with the prompt in Claude's prompt box for you to edit
#                or send. You review its fix, and leader m in it commits the merge; then both
#                close. While Claude fixes them you go on to a session that needs you, and Enter
#                takes you back there first once it is done. Without it, a conflict only gets a
#                notice
#   params       values the panel asks for, each set as CS_<NAME>, trimmed, for commit, command
#                and on_conflict: [{ name = "ticket", prompt = "ADO ticket", default = "" }].
#                The name is lowercase letters, digits and _, and not one of the variables
#                above; prompt is what the panel shows before it (default: the name); default is
#                what it starts with, $CS_* names filled in. Up and Down go from field to field,
#                and a value you typed stays when Tab picks another action that asks for it.
#                Empty is a value too: the action says what it needs
#   after        what a command that exits 0 does to the session:
#                  "remove"  it closes, and its worktree goes if nothing in it would be lost
#                            (the default)
#                  "keep"    it closes and its worktree stays, branch and all: leader f finds it,
#                            by its branch too, and resumes it there, to work on it again, as
#                            when a pull request is reviewed
#                  "stay"    it stays open
#
# Leader m does nothing while Claude is working, nor when there is nothing to merge. With
# several [[merge]], Tab picks one in the panel. This one is the default:
[[merge]]
name = "merge"
command = '''
set -e
[ -n "$CS_REPO_BRANCH" ] || { echo "$CS_REPO is on no branch"; exit 1; }
[ "$CS_BRANCH" != "$CS_REPO_BRANCH" ] || { echo "committed on $CS_BRANCH: nothing to merge"; exit 0; }
cd "$CS_REPO"
git diff --quiet HEAD || { echo "$CS_REPO has uncommitted changes, or an unfinished merge"; exit 1; }
git merge --no-edit "$CS_BRANCH"'''
on_conflict = """\
Merging branch `$CS_BRANCH` into `$CS_REPO_BRANCH` stopped on conflicts in this checkout. \
Resolve each conflict, keeping what both sides meant, mark each resolved file with `git add`, \
and run the project's checks if it has them. Don't commit the merge and don't abort it: I \
review it and commit it myself. If a conflict can't be resolved safely, stop and explain it."""

