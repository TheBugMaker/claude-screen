[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["Ghassen <ochi1ghassen@gmail.com>"]
publish = false

[workspace.dependencies]
# Internal crates
ccs-core = { path = "crates/ccs-core" }
ccs-claude = { path = "crates/ccs-claude" }
ccs-term = { path = "crates/ccs-term" }

# TUI
ratatui = "0.30.2"
frizbee = "0.13.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
tui-term = "0.3.4"
vt100 = "0.16.2"
portable-pty = "0.9.0"

# Async
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "signal", "net"] }
tokio-util = "0.7.20"
futures = "0.3.34"

# Data & config
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
shell-words = "1.1.1"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
etcetera = "0.11.0"
notify = "8.2.0"

# CLI, errors, logging
clap = { version = "4.6.7", features = ["derive", "env"] }
color-eyre = "0.6.5"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"

# Dev
insta = "1.49.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
